<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 12 84 84" width="84" height="84" role="img" aria-label="SensorStream">
  <defs>
    <radialGradient id="bg" cx="38%" cy="22%" r="95%">
      <stop offset="0%" stop-color="#1B3550"/>
      <stop offset="45%" stop-color="#0E1A2A"/>
      <stop offset="100%" stop-color="#060A10"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9D4E2"/>
      <stop offset="100%" stop-color="#6E7C90"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12314A"/>
      <stop offset="100%" stop-color="#070C14"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="84" height="84" rx="20" fill="url(#bg)"/>
  <g transform="translate(54 54) scale(0.82) translate(-52 -55)">

  <!-- orbit ring, back half (behind the phone) -->
  <g transform="rotate(-14 50 60)">
    <path d="M20 60 A30 9.5 0 0 1 80 60" fill="none" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- phone -->
  <g transform="rotate(-12 48 56)">
    <rect x="34" y="31" width="28" height="50" rx="6.5" fill="url(#body)"/>
    <rect x="34" y="31" width="28" height="50" rx="6.5" fill="none" stroke="#22D3EE" stroke-width="1.6"/>
    <rect x="36.4" y="33.4" width="23.2" height="45.2" rx="4.6" fill="url(#screen)"/>
    <circle cx="48" cy="36.6" r="1.1" fill="#0B1220"/>
    <!-- XYZ gizmo on the screen -->
    <g stroke-linecap="round" stroke-width="2.6" fill="none">
      <line x1="48" y1="58" x2="48" y2="44.5" stroke="#4C8DFF"/>
      <line x1="48" y1="58" x2="57.5" y2="58" stroke="#FF5C5C"/>
      <line x1="48" y1="58" x2="41.2" y2="64.8" stroke="#3FD07A"/>
    </g>
    <path d="M48 41.2 L51.2 46 L44.8 46 Z" fill="#4C8DFF"/>
    <path d="M60.8 58 L56 61.2 L56 54.8 Z" fill="#FF5C5C"/>
    <path d="M38.8 67.2 L40 61.6 L44.4 66 Z" fill="#3FD07A"/>
    <circle cx="48" cy="58" r="2.4" fill="#F2F6FF"/>
  </g>

  <!-- orbit ring, front half (in front of the phone) -->
  <g transform="rotate(-14 50 60)">
    <path d="M80 60 A30 9.5 0 0 1 20 60" fill="none" stroke="url(#ring)" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- stream arcs: the phone broadcasting to the laptop -->
  <g fill="none" stroke="#22D3EE" stroke-linecap="round" stroke-width="3">
    <path d="M67.5 38.5 A7 7 0 0 1 70.5 47.5"/>
    <path d="M71.5 33.5 A13 13 0 0 1 77 50" stroke-opacity="0.75"/>
    <path d="M75.5 28.5 A19 19 0 0 1 83.5 52.5" stroke-opacity="0.5"/>
  </g>
  </g>
</svg>
